<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section class="image">
            <img src="images/image.svg" alt="Ilustração de login">
        </section>

        <section class="login">
            <div class="login-content">
                <h3>Bem-vindo de volta</h3>
                <h2>Faça login na sua conta</h2>

                <form action="#">
                    <div class="form-control">
                        <label for="iemail">E-mail</label>

                        <input
                            type="email"
                            name="email"
                            id="iemail"
                            placeholder="exemplo@gmail.com"
                            required
                        >
                    </div>

                    <div class="form-control">
                        <label for="ipassword">Senha</label>

                        <input
                            type="password"
                            name="password"
                            id="ipassword"
                            placeholder="0123456789"
                            required
                        >
                    </div>

                    <div class="important">
                        <label class="remember" for="iremember">
                            <input
                                type="checkbox"
                                name="remember"
                                id="iremember"
                            >

                            Lembre de mim
                        </label>

                        <a href="#">Esqueceu sua senha?</a>
                    </div>

                    <div class="actions">
                        <button
                            class="btn-entrar"
                            type="submit"
                        >
                            Entrar na conta
                        </button>

                        <button
                            class="btn-entrar-google"
                            type="button"
                        >
                            Ou faça login com o Google
                        </button>
                    </div>
                </form>

                <p class="register">
                    Não tem uma conta?
                    <a href="#">Cadastre-se</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
