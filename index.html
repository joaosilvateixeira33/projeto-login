<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section>
            <img src="images/image.svg" alt="icone">
        </section>
        <section>
            <h3>Bem-vindo de volta</h3>
            <h2>Faça login na sua conta</h2>

            <form action="#">
                <div class="form-control">
                    <label for="iemail">E-mail</label>
                    <input type="email" name="email" id="iemail" placeholder="exemplo@gmail.com">
                </div>
                
                <div class="form-control">
                    <label for="ipassword">Senha</label>
                    <input type="password" name="password" id="ipassword" placeholder="0123456789">
                </div>

                <div class="important">
                    <p><input type="radio" name="remember" id="iremember"> Lembre de mim</p>
                    <a href="#">Esqueceu sua senha?</a>
                </div>

                <div class="actions">
                    <button type="submit">Entrar na conta</button>
                    <button type="submit">Ou faça login com o google</button>
                </div>
            </form>

            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </section>
    </main>
</body>
</html>
